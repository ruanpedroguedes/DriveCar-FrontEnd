<div class="card">
  <div class="card__header">
    <h2 class="card__title">Listagem de carros</h2>
    <button type="button" class="btn btn--primary" routerLink="/admin/carros/new">Novo</button>
  </div>

  <div class="table-container">
    <table class="table">
      <thead>
        <tr>
          <th style="width: 10%;">ID</th>
          <th style="width: 20%;">Nome</th>
          <th style="width: 20%;">Modelo</th>
          <th style="width: 20%;">Marca</th> <th style="width: 30%; text-align: right; padding-right: 2rem;">Ações</th>
        </tr>
      </thead>
      <tbody>
        @for (carro of lista; track carro.id) {
          <tr>
            <td>{{ carro.id }}</td>
            <td>{{ carro.nome }}</td>
            <td>{{ carro.modelo }}</td>
            <td>{{ carro.marca?.nome }}</td> <td class="table__actions">
              <button type="button" class="btn btn--edit" [routerLink]="['/admin/carros/edit', carro.id]">EDITAR</button>
              <button type="button" class="btn btn--delete" (click)="deleteById(carro)">DELETAR</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" style="text-align: center; padding: 2rem; color: #8c8c8c;"> 
              Nenhum carro encontrado na lista.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
