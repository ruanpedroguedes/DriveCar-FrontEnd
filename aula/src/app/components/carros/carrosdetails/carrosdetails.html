<div class="login-wrapper">
  <div class="login-card">
    
    <h3 class="login-title">Cadastro de Carro</h3>
    
    <form>
      <div class="input-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Digite o nome do carro" [(ngModel)]="carro.nome" />
      </div>

      <div class="input-group">
        <label for="modelo">Modelo</label>
        <input type="text" id="modelo" name="modelo" placeholder="Digite o modelo do carro" [(ngModel)]="carro.modelo" />
      </div>

      <div class="input-group">
        <label for="marca">Marca</label>
        <select id="marca" name="marca" [(ngModel)]="carro.marca">
          <option [ngValue]="null" disabled>Selecione uma marca</option>
          @for (m of marcas; track m.id) {
            <option [ngValue]="m">{{ m.nome }}</option>
          }
        </select>
      </div>

      <button type="button" class="btn-login" (click)="save()">Salvar</button>
    </form>

  </div>
</div>
