<div class="login-wrapper">
  <div class="login-card">
    
    <h3 class="login-title">Acessar Sistema</h3>
    
    <form>
      <div class="input-group">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" autocomplete="off" [(ngModel)]="usuario"  />
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" [(ngModel)]="senha" />
      </div>

      <button type="button" class="btn-login" (click)="logar()">Entrar</button>
    </form>

  </div>
</div>
